name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan history and working tree
        run: ./gitleaks detect --source . --no-banner -c .gitleaks.toml

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]" bandit pip-audit
      - name: Bandit (fail on high severity)
        run: .venv/bin/bandit -q -r apps services data infra -x apps/api/tests,apps/web/node_modules,services/nel/tests --severity-level high
      - name: pip-audit
        run: .venv/bin/pip-audit --progress-spinner off

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem, configuration, and secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: node_modules,.venv,.next,.local,data/raw
