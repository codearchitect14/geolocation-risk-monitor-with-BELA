[project]
name = "meridian-signal-data"
version = "0.1.0"
description = "Data acquisition tooling for the operational disruption intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "pyarrow>=15",
    "pyshp>=2.3",
    "trafilatura>=1.12",
    "lingua-language-detector>=2.0",
    "huggingface_hub>=0.24",
    "orjson>=3.9",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "types-defusedxml"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["data/scripts", "data/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"data/tests/*" = ["S", "E501"]

[tool.pytest.ini_options]
pythonpath = ["data/scripts"]
testpaths = ["data/tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "data/scripts"
explicit_package_bases = true
ignore_missing_imports = true
